setInterval(refreshImages,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshImages()});window.addEventListener('online',()=>{if(S.user&&!S.pending)run(loadView)});window.addEventListener('offline',()=>notify('No hay conexión. Tus cambios necesitan internet para guardarse.'));
</script></body></html>
